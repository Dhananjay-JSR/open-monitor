services:
  - type: web
    name: open-monitor
    runtime: docker
    plan: starter # disks need a paid instance
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: API_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: LLM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
