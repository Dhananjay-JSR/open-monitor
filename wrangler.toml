name = "open-monitor"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# the scheduler: runs due monitors and retries webhooks once a minute
[triggers]
crons = ["* * * * *"]

# create it with `wrangler d1 create open-monitor` and paste the id here
[[d1_databases]]
binding = "DB"
database_name = "open-monitor"
database_id = "00000000-0000-0000-0000-000000000000"

# the dashboard is assembled from these files at startup, so they are bundled as text
[[rules]]
type = "Text"
globs = ["**/dashboard/index.html", "**/dashboard/*.css", "**/dashboard/app.js"]
fallthrough = false

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = false

# Cloudflare's own Workers tracing is off by default; open-monitor exports its own spans when
# OTEL_EXPORTER_OTLP_ENDPOINT is set. To also get Cloudflare's automatic traces and logs
# (requests, bindings), uncomment this and set up an export destination in the dashboard:
# [observability]
# enabled = true
# [observability.traces]
# enabled = true
# destinations = ["<your destination name>"]

# Secrets are set with `wrangler secret put NAME`:
#   API_KEY, LLM_API_KEY, TAVILY_API_KEY, DASHBOARD_USER, DASHBOARD_PASSWORD, SESSION_SECRET
# Plain settings can go here:
# [vars]
# LLM_BASE_URL = "https://openrouter.ai/api/v1"
# LLM_MODEL = "openrouter/free"
