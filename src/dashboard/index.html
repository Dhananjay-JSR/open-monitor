<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Monitor</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div class="boot" aria-busy="true" aria-label="Loading">
    <div class="boot-brand">Open Monitor</div>
    <div class="boot-grid">
      <div class="boot-panel">
        <span class="boot-line w45"></span>
        <span class="boot-line w80"></span>
        <span class="boot-line w65"></span>
        <span class="boot-line w35"></span>
      </div>
      <div class="boot-panel art">
        <span class="boot-line w70"></span>
        <span class="boot-line w90"></span>
        <span class="boot-line w55"></span>
        <span class="boot-line w75"></span>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
